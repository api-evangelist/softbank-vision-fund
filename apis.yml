aid: softbank-vision-fund
name: SoftBank Vision Fund
description: >-
  SoftBank Vision Fund (managed by SoftBank Investment Advisers) is one of the
  world's largest technology-focused investment funds, launched in May 2017 by
  SoftBank Group and anchored by the Public Investment Fund of Saudi Arabia. Now
  operating across two funds (SVF1 and SVF2) with combined assets under
  management reported at roughly $150B+, the fund pursues Masayoshi Son's long
  "AI economy" thesis, backing high-growth companies across the AI stack:
  hardware and semiconductors, the software infrastructure to gather, process
  and deploy data, and the applications built on top of it. It typically writes
  large late-stage growth checks (Series C/D and beyond, often $100M to several
  billion) into 300+ companies worldwide, spanning enterprise software, consumer
  internet, health tech, fintech, logistics, transportation, frontier tech,
  edtech and proptech across the Americas, EMEA and Asia. Headquartered in
  London, with major offices in the US and Asia, its portfolio includes many
  unicorns and household names such as Arm, ByteDance, and Aurora.
